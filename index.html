<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="clock-container">
    <p id="timezone-label" class="timezone-label">
      <span id="date-label" class="date-label"></span> <span id="timezone-name" class="timezone-name"></span>
    </p>
    <time id="clock" datetime="" aria-live="polite"></time>
    <time id="secondary-clock" class="secondary-clock" datetime="" aria-live="polite">
      <span id="secondary-date" class="secondary-date"></span> <span id="secondary-time"></span> <span id="secondary-timezone" class="secondary-timezone"></span>
    </time>
    <p id="countdown" class="countdown" aria-live="polite">
      <svg class="countdown-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="13" r="7.5"></circle>
        <path d="M12 13V9.5M12 13l3 1.75M9.5 3.5h5M12 3.5V5.5M18 7l1.5-1.5"></path>
      </svg>
      <span id="countdown-duration"></span> <span id="countdown-left"></span> <span id="countdown-target" class="countdown-target"></span>
    </p>
  </main>
  <script src="app.js"></script>
</body>
</html>
